[package]
name = "memorilo-device-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["fake-display"]
fake-display = []
real-display = []
color-test = []

[dependencies]
anyhow = "1.0.104"
log = "0.4.34"

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.52.1"
esp-idf-sys = "0.37.2"

[build-dependencies]
embuild = { version = "0.33.4", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.2"
esp_idf_tools_install_dir = "global"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
